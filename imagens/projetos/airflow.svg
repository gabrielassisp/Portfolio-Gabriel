<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc"><title id="title">Ingestão Bronze com Airflow</title><desc id="desc">Validação do schema libera três ramos: Huggy; negócios e histórico Zoho; validação de contas e anúncios Meta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#5de2c2"/></marker></defs><rect width="1440" height="980" fill="#101c2d"/><g font-family="Arial,sans-serif"><text x="90" y="112" fill="#5de2c2" font-size="25" letter-spacing="4">ENTERPRISE DATA PLATFORM</text><text x="90" y="190" fill="white" font-size="56" font-weight="bold">Orquestração com Airflow</text><text x="90" y="243" fill="#b7c9dc" font-size="26">Huggy · Zoho Bigin · Meta Ads → PostgreSQL Bronze</text><g fill="none" stroke="#5de2c2" stroke-width="4" marker-end="url(#arrow)"><path d="M720 385V435H300V490"/><path d="M720 385V490"/><path d="M720 435H1140V490"/><path d="M720 590V670"/><path d="M1140 590V670"/></g><g fill="#1c3047" stroke="#456078" stroke-width="2"><rect x="485" y="295" width="470" height="90" rx="18"/><rect x="100" y="490" width="400" height="100" rx="18"/><rect x="520" y="490" width="400" height="100" rx="18"/><rect x="940" y="490" width="400" height="100" rx="18"/><rect x="520" y="670" width="400" height="100" rx="18"/><rect x="940" y="670" width="400" height="100" rx="18"/></g><g fill="white" font-size="27" text-anchor="middle"><text x="720" y="350">Validar schema Bronze</text><text x="300" y="550">Carregar chats Huggy</text><text x="720" y="550">Carregar negócios Zoho</text><text x="1140" y="550">Validar contas Meta</text><text x="720" y="730">Carregar histórico Zoho</text><text x="1140" y="730">Carregar anúncios Meta</text></g><text x="90" y="865" fill="#5de2c2" font-size="28">6 tarefas · 4 scripts ETL · 5 tabelas de destino</text><text x="90" y="916" fill="#b7c9dc" font-size="23">Disparo manual · Dependências extraídas do código · Diagrama de arquitetura</text></g></svg>