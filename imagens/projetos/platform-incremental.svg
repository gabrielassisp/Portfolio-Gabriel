<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc"><title id="title">Trechos reais do modelo incremental dbt</title><desc id="desc">Configuração e filtro extraídos de fct_deals.sql, demo pública PostgreSQL/dbt com dados fictícios.</desc><rect width="1440" height="600" rx="28" fill="#0c0f14"/><text x="65" y="66" fill="#facc15" font-family="sans-serif" font-size="26">CÓDIGO REAL · DEMO PÚBLICA</text><text x="65" y="132" fill="#f5f5f5" font-family="sans-serif" font-size="46" font-weight="700">Gold incremental com dbt</text><text x="65" y="186" fill="#a3a3a3" font-family="monospace" font-size="24">Trechos de platform-demo/dbt/models/fct_deals.sql</text><text x="65" y="268" fill="#d4dde9" font-family="monospace" font-size="27">{{ config(materialized=&#x27;incremental&#x27;, unique_key=&#x27;deal_id&#x27;,</text><text x="65" y="316" fill="#d4dde9" font-family="monospace" font-size="27">   incremental_strategy=&#x27;delete+insert&#x27;, on_schema_change=&#x27;fail&#x27;) }}</text><text x="65" y="364" fill="#d4dde9" font-family="monospace" font-size="27"></text><text x="65" y="412" fill="#d4dde9" font-family="monospace" font-size="27">where existing.deal_id is null</text><text x="65" y="460" fill="#d4dde9" font-family="monospace" font-size="27">   or incoming.source_version &gt; existing.source_version</text><text x="65" y="554" fill="#facc15" font-family="sans-serif" font-size="24">Fonte versionada no GitHub · dados 100% fictícios</text></svg>