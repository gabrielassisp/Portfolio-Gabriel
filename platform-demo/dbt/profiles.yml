platform_demo:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('PGHOST', 'postgres') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'demo') }}"
      password: "{{ env_var('PGPASSWORD', 'demo_local_only') }}"
      dbname: "{{ env_var('PGDATABASE', 'portfolio_demo') }}"
      schema: silver
      threads: 1
      connect_timeout: 10
